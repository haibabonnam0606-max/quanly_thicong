<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="Nhập báo cáo khối lượng thi công hằng ngày theo đội – Quản Lý Thi Công">
  <title>Báo Cáo Khối Lượng Ngày | Quản Lý Thi Công</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════
       DESIGN TOKENS
    ════════════════════════════════════════════ */
    :root {
      --brand:          #1d4ed8;
      --brand-dark:     #1e3a8a;
      --brand-soft:     #dbeafe;
      --brand-mid:      #3b82f6;
      --critical:       #dc2626;
      --critical-bg:    #fef2f2;
      --critical-border:#fca5a5;
      --critical-soft:  #fee2e2;
      --success:        #16a34a;
      --success-bg:     #dcfce7;
      --warning:        #d97706;
      --warning-bg:     #fef3c7;
      --warning-border: #fcd34d;
      --surface:        #ffffff;
      --canvas:         #f0f4ff;
      --border:         #e2e8f0;
      --border-strong:  #94a3b8;
      --text-title:     #0f172a;
      --text-body:      #1e293b;
      --text-muted:     #64748b;
      --text-faint:     #94a3b8;
      --radius-card:    14px;
      --radius-btn:     12px;
      --shadow-card:    0 2px 12px rgba(15,23,42,0.07);
      --shadow-float:   0 8px 24px rgba(29,78,216,0.2);
      /* NFR: tap target minimum */
      --tap-min:        48px;
    }

    /* ════════════════════════════════════════════
       RESET & BASE
    ════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--canvas);
      color: var(--text-body);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
    }

    /* ════════════════════════════════════════════
       STICKY TOP BAR (one-thumb reach)
    ════════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--brand-dark);
      padding: env(safe-area-inset-top, 0) 0 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      gap: 12px;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .topbar-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .topbar-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; }
    .topbar-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-sub {
      font-size: 10.5px;
      color: #93c5fd;
      font-weight: 600;
      white-space: nowrap;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-icon {
      width: var(--tap-min);
      height: var(--tap-min);
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-icon:active { background: rgba(255,255,255,0.25); }
    .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* ════════════════════════════════════════════
       DATE PICKER STRIP
    ════════════════════════════════════════════ */
    .date-strip {
      background: #1e40af;
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-strip label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .date-input {
      flex: 1;
      height: var(--tap-min);
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      padding: 0 14px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .date-input:focus { border-color: #60a5fa; }
    .date-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }

    .btn-today {
      height: var(--tap-min);
      padding: 0 14px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-today:active { background: rgba(255,255,255,0.3); }

    /* ════════════════════════════════════════════
       PROJECT SELECTOR (pill row)
    ════════════════════════════════════════════ */
    .project-row {
      background: #1e3a8a;
      padding: 0 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .project-row label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .project-select {
      flex: 1;
      height: 44px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      padding: 0 12px;
      outline: none;
      min-width: 0;
      cursor: pointer;
    }
    .project-select option { background: #1e3a8a; color: #fff; }

    /* ════════════════════════════════════════════
       MAIN SCROLL CONTENT
    ════════════════════════════════════════════ */
    .main {
      flex: 1;
      padding: 14px 12px 120px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* ════════════════════════════════════════════
       SUMMARY BANNER (lũy kế tổng)
    ════════════════════════════════════════════ */
    .summary-banner {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .summary-banner-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .summary-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-chip {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-chip.over-plan {
      background: var(--warning-bg);
      border-color: var(--warning-border);
    }
    .stat-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--text-title); font-family: 'JetBrains Mono', monospace; }
    .stat-value.over { color: var(--warning); }

    /* ════════════════════════════════════════════
       SECTION HEADER
    ════════════════════════════════════════════ */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-title);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-count {
      font-size: 11px;
      font-weight: 700;
      background: var(--brand-soft);
      color: var(--brand);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ════════════════════════════════════════════
       TASK CARD (one-hand optimized)
    ════════════════════════════════════════════ */
    .task-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 0;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .task-card:active { box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .task-card.is-critical {
      border-color: var(--critical-border);
      background: var(--critical-bg);
    }

    /* Card header */
    .task-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 10px;
    }
    .task-critical-badge {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--critical-soft);
      border: 1.5px solid var(--critical-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .task-normal-badge {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--brand-soft);
      border: 1.5px solid #bfdbfe;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .task-info { flex: 1; min-width: 0; }
    .task-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-title);
      line-height: 1.3;
      word-break: break-word;
    }
    .task-card.is-critical .task-name { color: var(--critical); }
    .task-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .task-code-pill {
      font-size: 10.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }
    .tag-critical {
      font-size: 10px;
      font-weight: 800;
      background: var(--critical-soft);
      color: var(--critical);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--critical-border);
      letter-spacing: 0.3px;
    }
    .tag-es {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--brand);
      background: var(--brand-soft);
      padding: 2px 7px;
      border-radius: 5px;
    }

    /* Timeline bar */
    .task-timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 0 14px 10px;
    }
    .tl-cell {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }
    .task-card.is-critical .tl-cell { background: rgba(220,38,38,0.04); }
    .tl-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .tl-value { font-size: 14px; font-weight: 800; color: var(--text-title); font-family: 'JetBrains Mono', monospace; }
    .task-card.is-critical .tl-value { color: var(--critical); }

    /* Divider */
    .card-divider { height: 1px; background: var(--border); margin: 0 14px; }
    .task-card.is-critical .card-divider { background: var(--critical-border); }

    /* ── Input area ──────────────────────────────── */
    .task-input-area {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-label .planned-qty {
      font-weight: 800;
      color: var(--text-title);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Large quantity input row (NFR: ≥ 48px tap target) */
    .qty-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .qty-btn {
      width: var(--tap-min);
      min-width: var(--tap-min);
      height: var(--tap-min);
      background: #f1f5f9;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-btn);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-title);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.12s, transform 0.08s;
      flex-shrink: 0;
    }
    .qty-btn:active { background: #dbeafe; transform: scale(0.93); }
    .qty-btn.minus { font-size: 26px; }
    .qty-btn.plus { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
    .qty-btn.plus:active { background: var(--brand-dark); }

    .qty-input {
      flex: 1;
      height: var(--tap-min);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-btn);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-title);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
      min-width: 0;
      /* Remove spinners */
      -moz-appearance: textfield;
    }
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }
    .task-card.is-critical .qty-input:focus {
      border-color: var(--critical);
      box-shadow: 0 0 0 3px rgba(220,38,38,0.12);
    }

    /* Note textarea */
    .note-input {
      width: 100%;
      min-height: var(--tap-min);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-btn);
      padding: 12px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      color: var(--text-body);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .note-input:focus { border-color: var(--brand); }
    .note-input::placeholder { color: var(--text-faint); }

    /* Submit button per card (NFR: ≥ 48px) */
    .btn-submit {
      width: 100%;
      height: var(--tap-min);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: var(--radius-btn);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:active { transform: scale(0.97); opacity: 0.9; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .task-card.is-critical .btn-submit {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
    }

    /* Submit status chip */
    .submit-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .chip-success { background: var(--success-bg); color: var(--success); }
    .chip-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
    .chip-error   { background: var(--critical-soft); color: var(--critical); }

    /* ════════════════════════════════════════════
       EMPTY / LOADING / ERROR states
    ════════════════════════════════════════════ */
    .state-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-card);
    }
    .state-icon { font-size: 40px; }
    .state-title { font-size: 16px; font-weight: 800; color: var(--text-title); }
    .state-msg   { font-size: 13.5px; color: var(--text-muted); max-width: 280px; line-height: 1.5; }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-card { height: 180px; }

    /* ════════════════════════════════════════════
       FLOATING SUBMIT ALL BUTTON
    ════════════════════════════════════════════ */
    .fab-submit-all {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      min-width: 220px;
      height: 56px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: none;
      border-radius: 28px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(22,163,74,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
      padding: 0 28px;
    }
    .fab-submit-all:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 3px 12px rgba(22,163,74,0.3); }
    .fab-submit-all:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; }
    .fab-badge {
      background: rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 1px 8px;
      font-size: 13px;
    }

    /* ════════════════════════════════════════════
       TOAST NOTIFICATION
    ════════════════════════════════════════════ */
    .toast-container {
      position: fixed;
      top: calc(72px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 400px;
    }
    .toast {
      background: #1e293b;
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      animation: toastIn 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.toast-success { background: #16a34a; }
    .toast.toast-warn    { background: #d97706; }
    .toast.toast-error   { background: #dc2626; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ════════════════════════════════════════════
       RESPONSIVE: larger screens
    ════════════════════════════════════════════ */
    @media (min-width: 640px) {
      .main { padding: 20px 16px 100px; }
      .task-timeline { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>

<body>
  <!-- ══════════════════════════════════════════
       TOP BAR
  ══════════════════════════════════════════ -->
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <div class="topbar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        </div>
        <div>
          <div class="topbar-title">Báo Cáo Khối Lượng</div>
          <div class="topbar-sub" id="topbar-sub">Chọn dự án và ngày báo cáo</div>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="schedule.html" class="btn-icon" aria-label="Bảng tiến độ" title="Bảng tiến độ">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </a>
        <button class="btn-icon" id="btn-logout" aria-label="Đăng xuất" title="Đăng xuất">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
    <!-- Date + project pickers -->
    <div class="date-strip">
      <label for="date-picker">📅 Ngày</label>
      <input type="date" id="date-picker" class="date-input" aria-label="Chọn ngày báo cáo">
      <button class="btn-today" id="btn-today" aria-label="Về hôm nay">Hôm nay</button>
    </div>
    <div class="project-row">
      <label for="project-select">🏗 Dự án</label>
      <select id="project-select" class="project-select" aria-label="Chọn dự án">
        <option value="">-- Đang tải... --</option>
      </select>
    </div>
  </header>

  <!-- Toast area -->
  <div class="toast-container" id="toast-container" role="alert" aria-live="polite"></div>

  <!-- ══════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════ -->
  <main class="main" id="main-content">
    <!-- Summary banner -->
    <div class="summary-banner" id="summary-banner" hidden>
      <div class="summary-banner-title">📊 Lũy kế hôm nay – <span id="summary-date"></span></div>
      <div class="summary-stats" id="summary-stats"></div>
    </div>

    <!-- Section header -->
    <div class="section-header" id="section-header" hidden>
      <div class="section-title">
        <span>📋 Danh sách việc (theo ngày bắt đầu)</span>
      </div>
      <span class="section-count" id="task-count-badge">0</span>
    </div>

    <!-- Task list will be rendered here -->
    <div id="task-list">
      <div class="state-card">
        <div class="state-icon">🏗️</div>
        <div class="state-title">Chọn dự án để bắt đầu</div>
        <div class="state-msg">Chọn dự án và ngày báo cáo để xem danh sách công việc của đội.</div>
      </div>
    </div>
  </main>

  <!-- FAB: nộp tất cả -->
  <button class="fab-submit-all" id="fab-submit-all" disabled aria-label="Nộp tất cả báo cáo trong ngày" hidden>
    ✅ Nộp tất cả
    <span class="fab-badge" id="fab-count">0</span>
  </button>

  <!-- ══════════════════════════════════════════
       JAVASCRIPT
  ══════════════════════════════════════════ -->
  <script>
    'use strict';

    // ── Constants ─────────────────────────────────────────────────────────
    const API = '';  // same-origin; prefix /api added per call
    const STEP = 0.5; // ± increment step for +/- buttons

    // ── State ─────────────────────────────────────────────────────────────
    let currentTasks   = [];   // scheduled tasks (sorted by ES)
    let currentProject = null; // {id, name, code}
    let currentDate    = '';

    // ── Auth helpers ───────────────────────────────────────────────────────
    function getToken()  { return localStorage.getItem('quanly_token') || ''; }
    function authHeader() { const t = getToken(); return t ? { 'Authorization': `Bearer ${t}` } : {}; }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtNum(n) {
      const v = Number(n);
      return isNaN(v) ? '—' : v.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
    }

    async function checkAuth() {
      const token = getToken();
      if (!token) { window.location.href = '/login.html'; return; }
      try {
        const res = await fetch('/api/auth/me', { headers: authHeader() });
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        const user = data.user || data.data || data;
        document.getElementById('topbar-sub').textContent =
          `👤 ${escapeHtml(user.full_name || user.email)}`;
      } catch { window.location.href = '/login.html'; }
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    function showToast(msg, type = 'success', durationMs = 3000) {
      const c = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      const icon = type === 'success' ? '✅' : type === 'warn' ? '⚠️' : '❌';
      el.textContent = `${icon} ${msg}`;
      c.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, durationMs - 300);
      setTimeout(() => c.removeChild(el), durationMs);
    }

    // ── Date helpers ───────────────────────────────────────────────────────
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ── Load Projects ──────────────────────────────────────────────────────
    async function loadProjects() {
      try {
        const res = await fetch('/api/projects', { headers: authHeader() });
        if (!res.ok) return;
        const data = await res.json();
        const sel = document.getElementById('project-select');
        const projects = data.data || [];
        if (projects.length === 0) {
          sel.innerHTML = '<option value="">-- Không có dự án --</option>';
          return;
        }
        sel.innerHTML = projects.map(p =>
          `<option value="${p.id}">${escapeHtml(p.name)} (${escapeHtml(p.code)})</option>`
        ).join('');

        // Restore from URL params or pick first
        const url = new URL(location.href);
        const pid = Number(url.searchParams.get('projectId'));
        if (pid && projects.some(p => p.id === pid)) {
          sel.value = pid;
          currentProject = projects.find(p => p.id === pid);
        } else {
          currentProject = projects[0];
          sel.value = projects[0].id;
        }
      } catch(e) {
        showToast('Không thể tải danh sách dự án', 'error');
      }
    }

    // ── Load Tasks (from scheduling/results, sorted by ES) ─────────────────
    async function loadTasks() {
      if (!currentProject) return;
      const pid = currentProject.id;
      setTaskListLoading();

      try {
        const res = await fetch(`/api/projects/${pid}/scheduling/results`, { headers: authHeader() });
        const data = await res.json();

        if (!res.ok || data.hasCycle) {
          showTaskListError(data.hasCycle
            ? '⚠️ Mạng công việc có chu trình, không thể lập tiến độ.'
            : (data.message || 'Không thể tải tiến độ')
          );
          return;
        }

        currentTasks = (data.tasks || []).sort((a, b) => {
          const esDiff = (a.earlyStart ?? 0) - (b.earlyStart ?? 0);
          return esDiff !== 0 ? esDiff : (a.taskId - b.taskId);
        });

        renderTaskList();
        await loadSummary();
      } catch(e) {
        showTaskListError('Lỗi kết nối máy chủ: ' + e.message);
      }
    }

    // ── Render task list ───────────────────────────────────────────────────
    function renderTaskList() {
      const container = document.getElementById('task-list');
      document.getElementById('section-header').hidden = false;
      document.getElementById('task-count-badge').textContent = currentTasks.length;

      if (currentTasks.length === 0) {
        container.innerHTML = `
          <div class="state-card">
            <div class="state-icon">📭</div>
            <div class="state-title">Chưa có công việc</div>
            <div class="state-msg">Dự án này chưa có công việc nào được lập tiến độ.</div>
          </div>`;
        document.getElementById('fab-submit-all').hidden = true;
        return;
      }

      container.innerHTML = currentTasks.map((t, idx) => buildTaskCard(t, idx)).join('');

      // Bind events
      currentTasks.forEach((t, idx) => {
        const cardId = `task-card-${idx}`;
        const qtyInput = document.getElementById(`qty-${idx}`);
        const minusBtn = document.getElementById(`btn-minus-${idx}`);
        const plusBtn  = document.getElementById(`btn-plus-${idx}`);
        const submitBtn = document.getElementById(`btn-submit-${idx}`);

        minusBtn.addEventListener('click', () => {
          const v = Math.max(0, (parseFloat(qtyInput.value) || 0) - STEP);
          qtyInput.value = parseFloat(v.toFixed(4));
        });
        plusBtn.addEventListener('click', () => {
          const v = (parseFloat(qtyInput.value) || 0) + STEP;
          qtyInput.value = parseFloat(v.toFixed(4));
        });
        // Long-press acceleration
        let pressTimer;
        [minusBtn, plusBtn].forEach(btn => {
          btn.addEventListener('pointerdown', () => {
            pressTimer = setTimeout(() => {
              const interval = setInterval(() => btn.click(), 80);
              btn.addEventListener('pointerup', () => clearInterval(interval), { once: true });
              btn.addEventListener('pointerleave', () => clearInterval(interval), { once: true });
            }, 500);
          });
          btn.addEventListener('pointerup', () => clearTimeout(pressTimer));
          btn.addEventListener('pointerleave', () => clearTimeout(pressTimer));
        });

        submitBtn.addEventListener('click', () => submitSingleReport(idx, t));
      });

      // FAB
      const fab = document.getElementById('fab-submit-all');
      fab.hidden = false;
      fab.disabled = false;
      updateFabCount();
    }

    function buildTaskCard(t, idx) {
      const isCrit = Boolean(t.isCritical);
      const critClass = isCrit ? 'is-critical' : '';
      const badge = isCrit
        ? `<div class="task-critical-badge" title="Việc găng – float = 0">🔥</div>`
        : `<div class="task-normal-badge" title="Không phải việc găng">📌</div>`;
      const critTag = isCrit
        ? `<span class="tag-critical">🔥 VIỆC GĂNG</span>`
        : '';
      const esTag = `<span class="tag-es">ES: Ngày ${fmtNum(t.earlyStart)}</span>`;
      const code = escapeHtml(t.code || `CV-${t.taskId}`);
      const name = escapeHtml(t.name || `Công việc #${t.taskId}`);

      const planned = t.plannedQty != null ? fmtNum(t.plannedQty) : '—';

      return `
        <div class="task-card ${critClass}" id="task-card-${idx}" role="article" aria-label="Công việc: ${name}">
          <div class="task-card-header">
            ${badge}
            <div class="task-info">
              <div class="task-name">${name}</div>
              <div class="task-meta-row">
                <span class="task-code-pill">${code}</span>
                ${esTag}
                ${critTag}
              </div>
            </div>
          </div>

          <div class="task-timeline" aria-label="Tiến độ CPM">
            <div class="tl-cell">
              <div class="tl-label">ES</div>
              <div class="tl-value">${fmtNum(t.earlyStart)}</div>
            </div>
            <div class="tl-cell">
              <div class="tl-label">EF</div>
              <div class="tl-value">${fmtNum(t.earlyFinish)}</div>
            </div>
            <div class="tl-cell">
              <div class="tl-label">Dur</div>
              <div class="tl-value">${fmtNum(t.duration)}</div>
            </div>
            <div class="tl-cell">
              <div class="tl-label">Float</div>
              <div class="tl-value">${fmtNum(t.totalFloat)}</div>
            </div>
          </div>

          <div class="card-divider"></div>

          <div class="task-input-area">
            <div class="input-label">
              📦 Khối lượng hôm nay
            </div>

            <div class="qty-row" role="group" aria-label="Nhập khối lượng">
              <button class="qty-btn minus" id="btn-minus-${idx}"
                      aria-label="Giảm khối lượng" style="min-height:${48}px">−</button>
              <input  class="qty-input" id="qty-${idx}"
                      type="number" min="0" step="0.5" value="0"
                      inputmode="decimal"
                      aria-label="Khối lượng báo cáo (số)">
              <button class="qty-btn plus" id="btn-plus-${idx}"
                      aria-label="Tăng khối lượng" style="min-height:${48}px">+</button>
            </div>

            <textarea class="note-input" id="note-${idx}"
                      placeholder="Ghi chú (tuỳ chọn)..."
                      rows="2" aria-label="Ghi chú báo cáo"></textarea>

            <div id="submit-status-${idx}"></div>

            <button class="btn-submit" id="btn-submit-${idx}"
                    aria-label="Nộp báo cáo cho công việc ${name}" style="min-height:48px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Nộp báo cáo
            </button>
          </div>
        </div>`;
    }

    // ── Submit single report ───────────────────────────────────────────────
    async function submitSingleReport(idx, task) {
      const qty  = parseFloat(document.getElementById(`qty-${idx}`).value);
      const note = document.getElementById(`note-${idx}`).value.trim();
      const statusEl = document.getElementById(`submit-status-${idx}`);
      const btn = document.getElementById(`btn-submit-${idx}`);

      if (isNaN(qty) || qty < 0) {
        statusEl.innerHTML = `<div class="submit-chip chip-error">❌ Khối lượng không hợp lệ</div>`;
        return;
      }

      // We need work_item_id – tasks from scheduling/results have taskId.
      // We'll use taskId as a proxy to get work_item_id from task detail.
      // For efficiency, fetch task detail only when submitting.
      btn.disabled = true;
      btn.innerHTML = `<span>⏳</span> Đang nộp...`;

      try {
        // Get task detail to find work_item_id
        const taskRes = await fetch(`/api/tasks/${task.taskId}`, { headers: authHeader() });
        const taskData = await taskRes.json();
        if (!taskRes.ok || !taskData.data?.work_item_id) {
          throw new Error('Không lấy được hạng mục WBS của công việc này');
        }
        const workItemId = taskData.data.work_item_id;

        const pid = currentProject.id;
        const body = {
          work_item_id: workItemId,
          report_date:  currentDate,
          quantity:     qty,
          note:         note || undefined
        };

        const res = await fetch(`/api/projects/${pid}/daily-volume`, {
          method: 'POST',
          headers: { ...authHeader(), 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Lỗi khi nộp báo cáo');
        }

        const isNew = data.isNew;
        let html = `<div class="submit-chip chip-success">✅ ${isNew ? 'Đã nộp' : 'Đã cập nhật'} – Lũy kế: <strong>${fmtNum(data.cumulativeQuantity)}</strong></div>`;
        if (data.isOverPlan) {
          html += `<div class="submit-chip chip-warning" style="margin-top:6px">⚠️ Lũy kế vượt kế hoạch!</div>`;
        }
        statusEl.innerHTML = html;

        showToast(
          `${escapeHtml(task.name || `CV-${task.taskId}`)}: ${isNew ? 'Đã nộp' : 'Đã cập nhật'} ${fmtNum(qty)}`,
          data.isOverPlan ? 'warn' : 'success'
        );

        updateFabCount();
        await loadSummary();
      } catch(e) {
        statusEl.innerHTML = `<div class="submit-chip chip-error">❌ ${escapeHtml(e.message)}</div>`;
        showToast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Nộp báo cáo`;
      }
    }

    // ── Submit ALL visible ─────────────────────────────────────────────────
    document.getElementById('fab-submit-all').addEventListener('click', async () => {
      const fab = document.getElementById('fab-submit-all');
      fab.disabled = true;
      for (let idx = 0; idx < currentTasks.length; idx++) {
        const qty = parseFloat(document.getElementById(`qty-${idx}`)?.value);
        if (!isNaN(qty) && qty > 0) {
          await submitSingleReport(idx, currentTasks[idx]);
          await new Promise(r => setTimeout(r, 120)); // slight delay UX
        }
      }
      fab.disabled = false;
      showToast('Đã nộp tất cả báo cáo có giá trị > 0', 'success');
    });

    function updateFabCount() {
      let count = 0;
      currentTasks.forEach((_, idx) => {
        const v = parseFloat(document.getElementById(`qty-${idx}`)?.value || '0');
        if (v > 0) count++;
      });
      document.getElementById('fab-count').textContent = count;
    }

    // ── Load summary banner ────────────────────────────────────────────────
    async function loadSummary() {
      if (!currentProject) return;
      const pid = currentProject.id;
      try {
        const res = await fetch(
          `/api/projects/${pid}/daily-volume/summary`,
          { headers: authHeader() }
        );
        if (!res.ok) return;
        const data = await res.json();
        const banner = document.getElementById('summary-banner');
        const stats  = document.getElementById('summary-stats');
        document.getElementById('summary-date').textContent = currentDate;

        const totalCum = (data.data || []).reduce((s, d) => s + d.cumulativeQuantity, 0);
        const overCount = data.overPlanCount || 0;

        stats.innerHTML = `
          <div class="stat-chip">
            <div class="stat-label">Lũy kế toàn dự án</div>
            <div class="stat-value">${fmtNum(totalCum)}</div>
          </div>
          <div class="stat-chip ${overCount > 0 ? 'over-plan' : ''}">
            <div class="stat-label">Hạng mục vượt KH</div>
            <div class="stat-value ${overCount > 0 ? 'over' : ''}">${overCount}</div>
          </div>`;

        banner.hidden = false;
      } catch {}
    }

    // ── State helpers ──────────────────────────────────────────────────────
    function setTaskListLoading() {
      document.getElementById('task-list').innerHTML = `
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card" style="height:160px;margin-top:10px"></div>
        <div class="skeleton skeleton-card" style="height:160px;margin-top:10px"></div>`;
      document.getElementById('section-header').hidden = true;
      document.getElementById('fab-submit-all').hidden = true;
      document.getElementById('summary-banner').hidden = true;
    }
    function showTaskListError(msg) {
      document.getElementById('task-list').innerHTML = `
        <div class="state-card">
          <div class="state-icon">⚠️</div>
          <div class="state-title">Không thể tải dữ liệu</div>
          <div class="state-msg">${escapeHtml(msg)}</div>
        </div>`;
      document.getElementById('section-header').hidden = true;
      document.getElementById('fab-submit-all').hidden = true;
    }

    // ── Event wiring ───────────────────────────────────────────────────────
    document.getElementById('btn-today').addEventListener('click', () => {
      document.getElementById('date-picker').value = todayStr();
      currentDate = todayStr();
    });

    document.getElementById('date-picker').addEventListener('change', e => {
      currentDate = e.target.value;
    });

    document.getElementById('project-select').addEventListener('change', async e => {
      const sel = e.target;
      const pid = Number(sel.value);
      const opt = sel.options[sel.selectedIndex];
      currentProject = { id: pid, name: opt.text };
      await loadTasks();
      await loadSummary();
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST', headers: authHeader() }); } catch {}
      localStorage.removeItem('quanly_token');
      window.location.href = '/login.html';
    });

    // ── Bootstrap ──────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();

      // Set today's date
      const today = todayStr();
      currentDate = today;
      document.getElementById('date-picker').value = today;

      await loadProjects();
      if (currentProject) {
        await loadTasks();
      }
    });
  </script>
</body>
</html>
